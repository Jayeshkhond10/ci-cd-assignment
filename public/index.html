<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 50px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            background: #16a34a;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>CI/CD Pipeline</h1>

        <p>
            Automated deployment using GitHub Actions and Vercel
        </p>

        <div class="status">
            Application Running Successfully ✓
        </div>
    </div>

</body>
</html>
